<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommender System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-custom py-3">
    <div class="container">

        <a class="navbar-brand fw-bold fs-3 mx-auto" href="#">
            Book Recommender System
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse mt-3 mt-lg-0" id="navbarNav">
            <ul class="navbar-nav mx-auto gap-lg-5">
                <li class="nav-item">
                    <a class="nav-link active fs-5" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link fs-5" href="/recommend">Recommend a Book</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link fs-5" href="#">Contact</a>
                </li>
            </ul>
        </div>

    </div>
</nav>

<!-- BOOK SECTION -->
<section class="container py-5">

    <h2 class="text-center section-title">
        Top 50 Books
    </h2>

    <div class="row g-4" id="bookContainer"></div>

    <!-- PAGINATION -->
    <div class="d-flex justify-content-center mt-5">
        <nav>
            <ul class="pagination" id="pagination"></ul>
        </nav>
    </div>

</section>

<footer>
    © 2026 Book Recommender System
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const books = {{ books | tojson }};
</script>

<script
src="{{ url_for('static', filename='js/home.js') }}">
</script>

</body>
</html>
